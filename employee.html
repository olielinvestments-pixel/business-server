<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>האזור האישי שלי</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f5f7;color:#222;direction:rtl}
.top{background:white;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.top h1{font-size:17px;font-weight:600;color:#111}
.logout-btn{padding:6px 14px;background:#f3f4f6;color:#374151;border:none;border-radius:8px;font-size:12px;cursor:pointer}
.container{padding:12px;max-width:520px;margin:0 auto}

.login-gate{position:fixed;inset:0;background:#f4f5f7;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.login-box{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:28px 24px;width:100%;max-width:320px;text-align:center}
.login-box h2{font-size:16px;margin-bottom:16px;color:#111}
.login-box input{width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-size:14px;outline:none;margin-bottom:10px}
.login-box input:focus{border-color:#93c5fd}
.login-box button{width:100%;padding:10px;background:#2563eb;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600}
.login-box .err{color:#dc2626;font-size:12px;margin-top:8px;min-height:14px}

.upload-panel{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:12px}
.upload-panel h3{font-size:14px;font-weight:600;color:#111;margin-bottom:10px}
.upload-panel .row{display:flex;gap:8px;margin-bottom:8px}
.upload-panel select,.upload-panel input[type=file]{flex:1;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;font-size:13px;background:white}
.upload-btn{width:100%;padding:10px;background:#059669;color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600}
.upload-btn:disabled{background:#9ca3af;cursor:not-allowed}
.upload-status{margin-top:8px;font-size:12px;padding:6px 10px;border-radius:8px;display:none}
.upload-status.success{background:#dcfce7;color:#15803d;display:block}
.upload-status.error{background:#fee2e2;color:#dc2626;display:block}
.upload-status.loading{background:#dbeafe;color:#1d4ed8;display:block}

.cards{display:flex;flex-direction:column;gap:10px}
.card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-month{font-size:15px;font-weight:600;color:#111}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.b-paid{background:#dcfce7;color:#15803d}
.b-unpaid{background:#fef3c7;color:#92400e}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-bottom:10px}
.field-label{font-size:11px;color:#6b7280;margin-bottom:2px}
.field-val{font-size:13px;color:#111;font-weight:500}
.card-footer{display:flex;gap:8px;padding-top:10px;border-top:1px solid #f3f4f6;flex-wrap:wrap}
.link-btn{font-size:12px;color:#1d4ed8;display:flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid #bfdbfe;border-radius:8px;background:#eff6ff;text-decoration:none;white-space:nowrap}
.link-btn.no-link{color:#9ca3af;border-color:#e5e7eb;background:#f9fafb;cursor:default}
.empty{text-align:center;padding:40px 20px;color:#9ca3af;font-size:14px}
.updated{font-size:11px;color:#9ca3af;text-align:center;padding:8px}
.admin-toggle-btn{padding:6px 12px;background:#7c3aed;color:white;border:none;border-radius:8px;font-size:12px;cursor:pointer;display:none;white-space:nowrap}
.emp-panel{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:12px}
.emp-panel h3{font-size:14px;font-weight:600;color:#111;margin-bottom:10px}
.emp-panel .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.emp-panel input{flex:1;min-width:100px;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;font-size:13px}
.emp-add-btn{padding:8px 16px;background:#2563eb;color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600}
.emp-card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:10px}
.emp-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.emp-card-header h4{font-size:15px;font-weight:600;color:#111}
.emp-card-header .emp-meta{font-size:12px;color:#6b7280}
.emp-admin-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:#374151;margin-bottom:10px;cursor:pointer}
.emp-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px;padding:10px;background:#f9fafb;border-radius:8px}
.emp-row .f-group{display:flex;flex-direction:column;gap:2px;min-width:90px}
.emp-row .f-group label{font-size:10px;color:#6b7280}
.emp-row .f-group input{border:1px solid #e5e7eb;border-radius:6px;padding:6px 8px;font-size:12px;width:100%}
.emp-row .save-btn{padding:7px 14px;background:#059669;color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600}
.emp-row .save-btn:disabled{background:#9ca3af;cursor:not-allowed}
.emp-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.emp-tabs::-webkit-scrollbar{display:none}
.emp-tab{font-size:12px;padding:6px 14px;border-radius:20px;white-space:nowrap;border:1px solid #e5e7eb;color:#6b7280;background:white;cursor:pointer;flex-shrink:0;font-weight:500}
.emp-tab.active{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8;font-weight:600}
.emp-row select.f-month{border:1px solid #e5e7eb;border-radius:6px;padding:6px 8px;font-size:12px;width:100%;background:white}
.emp-row .f-computed{border:1px solid #e5e7eb;border-radius:6px;padding:6px 8px;font-size:12px;width:100%;background:#f3f4f6;color:#111;font-weight:600;box-sizing:border-box;min-height:30px;display:flex;align-items:center}
.emp-rate-edit{display:flex;align-items:center;gap:4px;font-size:12px;color:#374151}
.emp-rate-edit input{width:70px;border:1px solid #e5e7eb;border-radius:6px;padding:4px 6px;font-size:12px}
</style>
</head>
<body>

<div class="login-gate" id="login-gate">
<div class="login-box">
<h2>👋 האזור האישי שלי</h2>
<input type="text" id="login-name" placeholder="שם מלא">
<input type="password" id="login-pass" placeholder="סיסמה" onkeydown="if(event.key==='Enter')doLogin()">
<button onclick="doLogin()">כניסה</button>
<div class="err" id="login-err"></div>
</div>
</div>

<div class="top">
<h1 id="top-title">האזור האישי שלי</h1>
<div style="display:flex;gap:6px;align-items:center">
<button class="admin-toggle-btn" id="admin-toggle-btn" onclick="toggleView()">ניהול עובדים</button>
<button class="logout-btn" onclick="logout()">התנתקות</button>
</div>
</div>

<div class="container">

<div id="personal-view">
<div class="upload-panel">
<h3>📎 העלאת קבלה לחודש</h3>
<div class="row">
<select id="upload-month"></select>
</div>
<div class="row">
<input type="file" id="upload-file" accept="image/*,application/pdf">
</div>
<button class="upload-btn" onclick="uploadReceipt()">העלה קבלה</button>
<div class="upload-status" id="upload-status"></div>
</div>

<div class="cards" id="cards"></div>
<div class="updated" id="updated"></div>
</div>

<div id="admin-view" style="display:none">
<div class="cards" id="admin-cards"></div>
<div class="updated" id="admin-updated"></div>
</div>

</div>

<script>
let empName='';
let empPass='';
let records=[];
let isAdminUser=false;
let currentView='personal';
let adminEmployees=[];
let adminRecords=[];
let selectedAdminEmpName=null;
const HEBREW_MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function buildMonthOptions(selected){
const now=new Date();
const opts=[];
for(let i=-2;i<=24;i++){
const d=new Date(now.getFullYear(),now.getMonth()-i,1);
opts.push(HEBREW_MONTHS[d.getMonth()]+' '+d.getFullYear());
}
if(selected&&!opts.includes(selected))opts.unshift(selected);
if(!selected)opts.unshift('');
return opts.map(m=>`<option value="${esc(m)}"${m===selected?' selected':''}>${m?esc(m):'בחר חודש...'}</option>`).join('');
}

function authHeaders(){
return {'x-emp-name':encodeURIComponent(empName),'x-emp-password':encodeURIComponent(empPass)};
}

function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;');}

function showLoginGate(err){
document.getElementById('login-gate').style.display='flex';
document.getElementById('login-err').textContent=err||'';
}

function logout(){
localStorage.removeItem('empName');
localStorage.removeItem('empPass');
empName='';empPass='';
isAdminUser=false;
currentView='personal';
document.getElementById('cards').innerHTML='';
document.getElementById('admin-toggle-btn').style.display='none';
document.getElementById('personal-view').style.display='';
document.getElementById('admin-view').style.display='none';
showLoginGate('');
}

function applyAdminState(isAdmin){
isAdminUser=!!isAdmin;
document.getElementById('admin-toggle-btn').style.display=isAdminUser?'block':'none';
}

function toggleView(){
currentView=currentView==='personal'?'admin':'personal';
document.getElementById('personal-view').style.display=currentView==='personal'?'':'none';
document.getElementById('admin-view').style.display=currentView==='admin'?'':'none';
document.getElementById('admin-toggle-btn').textContent=currentView==='personal'?'ניהול עובדים':'האזור שלי';
if(currentView==='admin')loadAdminData();
}

async function doLogin(){
const name=document.getElementById('login-name').value.trim();
const pass=document.getElementById('login-pass').value;
const errEl=document.getElementById('login-err');
errEl.textContent='';
if(!name||!pass){errEl.textContent='נא למלא שם וסיסמה';return;}
try{
const r=await fetch('/api/employee-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,password:pass})});
const d=await r.json();
if(d.ok){
empName=name;empPass=pass;
localStorage.setItem('empName',name);
localStorage.setItem('empPass',pass);
document.getElementById('login-gate').style.display='none';
document.getElementById('top-title').textContent='שלום, '+name;
applyAdminState(d.isAdmin);
load();
}else{
errEl.textContent=d.error||'שם או סיסמה שגויים';
}
}catch(e){errEl.textContent='שגיאת חיבור: '+e.message;}
}

function fmtMoney(v){
if(!v)return '—';
const n=parseFloat(String(v).replace(/[^0-9.]/g,''));
return isNaN(n)?v:'₪'+Math.round(n).toLocaleString();
}

function isChecked(val){
if(val===true)return true;
const s=String(val||'').trim().toUpperCase();
return s==='TRUE'||s==='V'||s==='YES'||s==='1'||s==='כן';
}

function linkBtn(url,icon,label){
if(!url||!url.trim())return `<span class="link-btn no-link">${icon} ${label}</span>`;
return `<a href="${url}" target="_blank" class="link-btn">${icon} ${label}</a>`;
}

function renderRecordCard(r){
const paid=isChecked(r.paid)||(r.paid&&parseFloat(String(r.paid).replace(/[^0-9.]/g,''))>0);
return `<div class="card">
<div class="card-header">
<span class="card-month">${r.month||'—'}</span>
<span class="badge ${paid?'b-paid':'b-unpaid'}">${paid?'שולם':'טרם שולם'}</span>
</div>
<div class="card-grid">
<div><div class="field-label">שעות</div><div class="field-val">${r.hours||'—'}</div></div>
<div><div class="field-label">עמלות ממכירה</div><div class="field-val">${fmtMoney(r.commission)}</div></div>
<div><div class="field-label">שולם</div><div class="field-val">${fmtMoney(r.paid)}</div></div>
<div><div class="field-label">תאריך תשלום</div><div class="field-val">${r.paidDate||'—'}</div></div>
</div>
${r.notes?`<div class="field-val" style="margin-bottom:10px">📝 ${r.notes}</div>`:''}
<div class="card-footer">
${linkBtn(r.receiptLink,'🧾','הקבלה שהעליתי')}
</div>
</div>`;
}

function empAdminRecordRow(name,r,rate){
const month=r.month||'';
return `<div class="emp-row" data-emp="${esc(name)}" data-rate="${esc(rate||0)}">
<div class="f-group"><label>חודש</label><select class="f-month">${buildMonthOptions(month)}</select></div>
<div class="f-group"><label>שעות</label><input type="text" class="f-hours" value="${esc(r.hours)}" oninput="updateAdminComputedPay(this)"></div>
<div class="f-group"><label>עמלות ממכירה</label><input type="text" class="f-commission" value="${esc(r.commission)}" oninput="updateAdminComputedPay(this)"></div>
<div class="f-group"><label>סכום לתשלום (אוטומטי)</label><div class="f-computed">${fmtMoney(r.paid)}</div></div>
<div class="f-group"><label>תאריך תשלום</label><input type="text" class="f-paidDate" value="${esc(r.paidDate)}"></div>
<div class="f-group" style="min-width:160px"><label>הערות</label><input type="text" class="f-notes" value="${esc(r.notes)}"></div>
<div class="f-group"><label>קבלה</label>${linkBtn(r.receiptLink,'🧾','קבלה')}</div>
<button class="save-btn" onclick="saveEmpAdminRecord(this)">💾 שמור</button>
</div>`;
}

function updateAdminComputedPay(input){
const row=input.closest('.emp-row');
const rate=parseFloat(row.dataset.rate)||0;
const hours=parseFloat(row.querySelector('.f-hours').value)||0;
const commission=parseFloat(row.querySelector('.f-commission').value)||0;
const total=Math.round((hours*rate+commission)*100)/100;
row.querySelector('.f-computed').textContent=fmtMoney(total);
}

function renderAdminEmployees(){
const container=document.getElementById('admin-cards');
let html=`<div class="emp-panel">
<h3>➕ הוספת עובד חדש</h3>
<div class="row">
<input type="text" id="new-emp-name" placeholder="שם מלא">
<input type="text" id="new-emp-pass" placeholder="סיסמה">
<input type="text" id="new-emp-phone" placeholder="טלפון">
<input type="text" id="new-emp-notes" placeholder="הערות">
<input type="text" id="new-emp-rate" placeholder="תעריף שעתי (₪)">
</div>
<label class="emp-admin-toggle"><input type="checkbox" id="new-emp-admin"> הרשאת מנהל (יוכל לראות ולערוך את כל העובדים)</label>
<button class="emp-add-btn" onclick="addEmpAdminEmployee()">הוסף עובד</button>
<div class="upload-status" id="emp-add-status"></div>
</div>`;
if(adminEmployees.length===0){
html+='<div class="empty">אין עובדים להצגה</div>';
container.innerHTML=html;
return;
}
if(!selectedAdminEmpName||!adminEmployees.some(e=>e.name===selectedAdminEmpName)){
selectedAdminEmpName=adminEmployees[0].name;
}
html+='<div class="emp-tabs">'+adminEmployees.map(e=>`<div class="emp-tab${e.name===selectedAdminEmpName?' active':''}" data-name="${esc(e.name)}" onclick="selectAdminEmpTab(this.dataset.name)">${esc(e.name)}</div>`).join('')+'</div>';
const emp=adminEmployees.find(e=>e.name===selectedAdminEmpName);
const empRecords=adminRecords.filter(r=>r.name===emp.name).sort((a,b)=>(b.month||'').localeCompare(a.month||''));
html+=`<div class="emp-card">
<div class="emp-card-header">
<h4>${esc(emp.name)}${emp.isAdmin?' <span style="font-size:11px;color:#7c3aed;font-weight:600">(מנהל)</span>':''}</h4>
<label class="emp-admin-toggle" style="margin-bottom:0"><input type="checkbox" class="emp-admin-check" data-name="${esc(emp.name)}" ${emp.isAdmin?'checked':''} onchange="toggleEmpAdmin(this)"> הרשאת מנהל</label>
<span class="emp-rate-edit">תעריף שעתי: <input type="text" class="emp-rate-input" data-name="${esc(emp.name)}" value="${esc(emp.rate||'')}" onchange="updateAdminEmployeeRate(this)"> ₪/שעה</span>
<span class="emp-meta">${esc(emp.phone||'')}${emp.notes?' · '+esc(emp.notes):''}</span>
</div>
${empRecords.map(r=>empAdminRecordRow(emp.name,r,emp.rate)).join('')}
${empAdminRecordRow(emp.name,{month:'',hours:'',commission:'',paid:'',paidDate:'',notes:'',receiptLink:''},emp.rate)}
</div>`;
container.innerHTML=html;
}

function selectAdminEmpTab(name){
selectedAdminEmpName=name;
renderAdminEmployees();
}

async function updateAdminEmployeeRate(input){
const name=input.dataset.name;
const emp=adminEmployees.find(e=>e.name===name);
if(!emp){return;}
const rate=input.value.trim();
input.disabled=true;
try{
const r=await fetch('/api/admin/employees',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({name:emp.name,password:emp.password,phone:emp.phone,notes:emp.notes,isAdmin:emp.isAdmin,rate})});
const d=await r.json();
if(d.success){
await loadAdminData();
}else{
alert('שגיאה: '+(d.error||'לא ידוע'));
}
}catch(e){
alert('שגיאת חיבור: '+e.message);
}finally{input.disabled=false;}
}

async function loadAdminData(){
document.getElementById('admin-updated').textContent='טוען...';
try{
const [rEmp,rRec]=await Promise.all([
fetch('/api/admin/employees',{headers:authHeaders()}),
fetch('/api/admin/employee-records',{headers:authHeaders()})
]);
if(rEmp.status===401||rRec.status===401){showLoginGate('הפג תוקף החיבור, התחבר שוב');return;}
const dEmp=await rEmp.json();
const dRec=await rRec.json();
adminEmployees=dEmp.employees||[];
adminRecords=dRec.records||[];
renderAdminEmployees();
document.getElementById('admin-updated').textContent='עודכן: '+new Date().toLocaleString('he-IL');
}catch(e){
document.getElementById('admin-updated').textContent='שגיאה: '+e.message;
}
}

async function saveEmpAdminRecord(btn){
const row=btn.closest('.emp-row');
const name=row.dataset.emp;
const month=row.querySelector('.f-month').value;
if(!month){alert('נא לבחור חודש');return;}
const payload={
name,month,
hours:row.querySelector('.f-hours').value.trim(),
commission:row.querySelector('.f-commission').value.trim(),
paidDate:row.querySelector('.f-paidDate').value.trim(),
notes:row.querySelector('.f-notes').value.trim()
};
const origLabel=btn.textContent;
btn.disabled=true;
btn.textContent='שומר...';
try{
const r=await fetch('/api/admin/employee-records',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify(payload)});
const d=await r.json();
if(d.success){
btn.textContent='✅ נשמר';
await loadAdminData();
}else{
btn.textContent=origLabel;
alert('שגיאה: '+(d.error||'לא ידוע'));
}
}catch(e){
btn.textContent=origLabel;
alert('שגיאת חיבור: '+e.message);
}finally{btn.disabled=false;}
}

async function addEmpAdminEmployee(){
const name=document.getElementById('new-emp-name').value.trim();
const pass=document.getElementById('new-emp-pass').value.trim();
const phone=document.getElementById('new-emp-phone').value.trim();
const notes=document.getElementById('new-emp-notes').value.trim();
const rate=document.getElementById('new-emp-rate').value.trim();
const isAdmin=document.getElementById('new-emp-admin').checked;
const statusEl=document.getElementById('emp-add-status');
if(!name||!pass){
statusEl.className='upload-status error';
statusEl.textContent='נא למלא שם וסיסמה';
return;
}
statusEl.className='upload-status loading';
statusEl.textContent='מוסיף עובד...';
try{
const r=await fetch('/api/admin/employees',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({name,password:pass,phone,notes,rate,isAdmin})});
const d=await r.json();
if(d.success){
statusEl.className='upload-status success';
statusEl.textContent='✅ העובד נוסף בהצלחה';
document.getElementById('new-emp-name').value='';
document.getElementById('new-emp-pass').value='';
document.getElementById('new-emp-phone').value='';
document.getElementById('new-emp-notes').value='';
document.getElementById('new-emp-rate').value='';
document.getElementById('new-emp-admin').checked=false;
selectedAdminEmpName=name;
await loadAdminData();
}else{
statusEl.className='upload-status error';
statusEl.textContent='שגיאה: '+(d.error||'לא ידוע');
}
}catch(e){
statusEl.className='upload-status error';
statusEl.textContent='שגיאת חיבור: '+e.message;
}
}

async function toggleEmpAdmin(checkbox){
const name=checkbox.dataset.name;
const emp=adminEmployees.find(e=>e.name===name);
if(!emp){checkbox.checked=!checkbox.checked;return;}
const wanted=checkbox.checked;
checkbox.disabled=true;
try{
const r=await fetch('/api/admin/employees',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({name:emp.name,password:emp.password,phone:emp.phone,notes:emp.notes,rate:emp.rate,isAdmin:wanted})});
const d=await r.json();
if(d.success){
await loadAdminData();
}else{
checkbox.checked=!wanted;
alert('שגיאה: '+(d.error||'לא ידוע'));
}
}catch(e){
checkbox.checked=!wanted;
alert('שגיאת חיבור: '+e.message);
}finally{checkbox.disabled=false;}
}

function populateMonthSelect(){
const sel=document.getElementById('upload-month');
const months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const now=new Date();
const options=[];
for(let i=0;i<6;i++){
const d=new Date(now.getFullYear(),now.getMonth()-i,1);
options.push(months[d.getMonth()]+' '+d.getFullYear());
}
sel.innerHTML=options.map(m=>`<option value="${m}">${m}</option>`).join('');
}

function fileToBase64(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=reject;
reader.readAsDataURL(file);
});
}

async function uploadReceipt(){
const month=document.getElementById('upload-month').value;
const fileInput=document.getElementById('upload-file');
const statusEl=document.getElementById('upload-status');
const btn=document.querySelector('.upload-btn');
if(!fileInput.files||fileInput.files.length===0){
statusEl.className='upload-status error';
statusEl.textContent='נא לבחור קובץ';
return;
}
statusEl.className='upload-status loading';
statusEl.textContent='מעלה קבלה...';
btn.disabled=true;
try{
const fileBase64=await fileToBase64(fileInput.files[0]);
const r=await fetch('/api/employee-receipt',{
method:'POST',
headers:Object.assign({'Content-Type':'application/json'},authHeaders()),
body:JSON.stringify({month,fileBase64})
});
if(r.status===401){showLoginGate('הפג תוקף החיבור, התחבר שוב');return;}
const d=await r.json();
if(d.success){
statusEl.className='upload-status success';
statusEl.textContent='✅ הקבלה הועלתה בהצלחה עבור '+month;
fileInput.value='';
load();
}else{
statusEl.className='upload-status error';
statusEl.textContent='שגיאה: '+(d.error||'לא ידוע');
}
}catch(e){
statusEl.className='upload-status error';
statusEl.textContent='שגיאת חיבור: '+e.message;
}finally{btn.disabled=false;}
}

async function load(){
document.getElementById('updated').textContent='טוען...';
try{
const r=await fetch('/api/employee-data',{headers:authHeaders()});
if(r.status===401){showLoginGate('הפג תוקף החיבור, התחבר שוב');return;}
const d=await r.json();
if(d.error)throw new Error(d.error);
applyAdminState(d.isAdmin);
records=d.records||[];
const container=document.getElementById('cards');
if(records.length===0){
container.innerHTML='<div class="empty">אין עדיין נתונים</div>';
}else{
records.sort((a,b)=>(b.month||'').localeCompare(a.month||''));
container.innerHTML=records.map(renderRecordCard).join('');
}
document.getElementById('updated').textContent='עודכן: '+new Date().toLocaleString('he-IL');
}catch(e){
document.getElementById('updated').textContent='שגיאה: '+e.message;
}
}

populateMonthSelect();
const savedName=localStorage.getItem('empName');
const savedPass=localStorage.getItem('empPass');
if(savedName&&savedPass){
empName=savedName;empPass=savedPass;
document.getElementById('login-gate').style.display='none';
document.getElementById('top-title').textContent='שלום, '+savedName;
load();
}else{
showLoginGate('');
}
</script>
