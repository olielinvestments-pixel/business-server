<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דשבורד עסקי</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f5f7;color:#222;direction:rtl}
.top{background:white;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.top h1{font-size:17px;font-weight:600;color:#111}
.refresh-btn{padding:6px 14px;background:#2563eb;color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px}
.container{padding:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:white;border-radius:10px;padding:12px 14px;border:1px solid #e5e7eb}
.stat-label{font-size:11px;color:#6b7280;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:700}
.stat-val.blue{color:#1d4ed8}
.stat-val.red{color:#dc2626}
.stat-val.amber{color:#d97706}
.stat-val.green{color:#16a34a}

/* Zoho Invoice Upload Panel */
.invoice-panel{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:12px}
.invoice-panel h3{font-size:14px;font-weight:600;color:#111;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.invoice-input-row{display:flex;gap:8px;align-items:center}
.invoice-input-row input{flex:1;border:1px solid #e5e7eb;border-radius:8px;padding:8px 12px;font-size:14px;outline:none;direction:ltr}
.invoice-input-row input:focus{border-color:#93c5fd}
.upload-btn{padding:8px 16px;background:#059669;color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500}
.upload-btn:disabled{background:#9ca3af;cursor:not-allowed}
.invoice-status{margin-top:8px;font-size:12px;padding:6px 10px;border-radius:8px;display:none}
.invoice-status.success{background:#dcfce7;color:#15803d;display:block}
.invoice-status.error{background:#fee2e2;color:#dc2626;display:block}
.invoice-status.loading{background:#dbeafe;color:#1d4ed8;display:block}

.search-bar{background:white;border-radius:10px;padding:10px 14px;border:1px solid #e5e7eb;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.search-bar input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:#222}
.search-bar input::placeholder{color:#9ca3af}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:12px;padding:6px 12px;border-radius:20px;white-space:nowrap;border:1px solid #e5e7eb;color:#6b7280;background:white;cursor:pointer;flex-shrink:0}
.tab.active{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8;font-weight:600}
.tab .cnt{font-size:11px;background:#f3f4f6;padding:1px 5px;border-radius:10px;margin-right:3px}
.tab.active .cnt{background:#bfdbfe;color:#1e40af}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px}
.card.urgent{border-color:#fca5a5;border-width:1.5px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-num{font-size:15px;font-weight:600;color:#111}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.b-open{background:#dbeafe;color:#1d4ed8}
.b-done{background:#dcfce7;color:#15803d}
.b-urgent{background:#fee2e2;color:#dc2626}
.b-service{background:#fef3c7;color:#92400e}
.b-sdone{background:#f3f4f6;color:#374151}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-bottom:10px}
.field-label{font-size:11px;color:#6b7280;margin-bottom:2px}
.field-val{font-size:13px;color:#111;font-weight:500}
.card-footer{display:flex;gap:8px;padding-top:10px;border-top:1px solid #f3f4f6;flex-wrap:wrap}
.link-btn{font-size:12px;color:#1d4ed8;display:flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid #bfdbfe;border-radius:8px;background:#eff6ff;text-decoration:none;white-space:nowrap}
.link-btn.no-link{color:#9ca3af;border-color:#e5e7eb;background:#f9fafb;cursor:default}
.notes-badge{font-size:11px;color:#6b7280;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:5px 8px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:40px 20px;color:#9ca3af;font-size:14px}
.updated{font-size:11px;color:#9ca3af;text-align:center;padding:8px}
.login-gate{position:fixed;inset:0;background:#f4f5f7;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.login-box{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:28px 24px;width:100%;max-width:320px;text-align:center}
.login-box h2{font-size:16px;margin-bottom:16px;color:#111}
.login-box input{width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-size:14px;outline:none;margin-bottom:10px;direction:ltr;text-align:center}
.login-box input:focus{border-color:#93c5fd}
.login-box button{width:100%;padding:10px;background:#2563eb;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600}
.login-box .err{color:#dc2626;font-size:12px;margin-top:8px;min-height:14px}
.emp-panel{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:12px}
.emp-panel h3{font-size:14px;font-weight:600;color:#111;margin-bottom:10px}
.emp-panel .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.emp-panel input{flex:1;min-width:100px;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;font-size:13px}
.emp-add-btn{padding:8px 16px;background:#2563eb;color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600}
.emp-card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:10px}
.emp-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.emp-card-header h4{font-size:15px;font-weight:600;color:#111}
.emp-card-header .emp-meta{font-size:12px;color:#6b7280}
.emp-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px;padding:10px;background:#f9fafb;border-radius:8px}
.emp-row .f-group{display:flex;flex-direction:column;gap:2px;min-width:90px}
.emp-row .f-group label{font-size:10px;color:#6b7280}
.emp-row .f-group input{border:1px solid #e5e7eb;border-radius:6px;padding:6px 8px;font-size:12px;width:100%}
.emp-row .save-btn{padding:7px 14px;background:#059669;color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600}
.emp-row .save-btn:disabled{background:#9ca3af;cursor:not-allowed}
.emp-admin-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:#374151;margin-bottom:10px;cursor:pointer}
@media(min-width:640px){
.stats{grid-template-columns:repeat(4,1fr)}
.cards{display:grid;grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="login-gate" id="login-gate">
<div class="login-box">
<h2>🔒 כניסה לדשבורד</h2>
<input type="password" id="login-pass" placeholder="סיסמה" onkeydown="if(event.key==='Enter')doLogin()">
<button onclick="doLogin()">כניסה</button>
<div class="err" id="login-err"></div>
</div>
</div>
<div class="top">
<h1>דשבורד עסקי</h1>
<button class="refresh-btn" onclick="load()">&#8635; רענן</button>
</div>
<div class="container">
<div class="stats">
<div class="stat"><div class="stat-label">הזמנות פתוחות</div><div class="stat-val blue" id="s-open">-</div></div>
<div class="stat"><div class="stat-label">דחופות</div><div class="stat-val red" id="s-urgent">-</div></div>
<div class="stat"><div class="stat-label">שירות פתוח</div><div class="stat-val amber" id="s-service">-</div></div>
<div class="stat"><div class="stat-label">סה"כ פתוח (₪)</div><div class="stat-val green" id="s-sum">-</div></div>
<div class="stat"><div class="stat-label">הוצאות החודש (₪)</div><div class="stat-val red" id="s-expenses">-</div></div>
</div>

<!-- Zoho Invoice Upload Panel -->
<div class="invoice-panel">
<h3>📤 העלאת חשבונית מ-Zoho</h3>
<div class="invoice-input-row">
<input type="text" id="zoho-inv-num" placeholder="מספר חשבונית (לדוגמה: INV-890019)" />
<button class="upload-btn" onclick="uploadZohoInvoice()">העלה</button>
</div>
<div class="invoice-status" id="invoice-status"></div>
</div>

<div class="search-bar">
<svg width="15" height="15" fill="none" stroke="#9ca3af" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
<input type="text" id="search" placeholder="חיפוש לפי מספר הזמנה, עיר..." oninput="render()">
</div>

<div class="tabs">
<div class="tab active" onclick="setTab('all',this)">הכל <span class="cnt" id="c-all">0</span></div>
<div class="tab" onclick="setTab('open',this)">פתוח <span class="cnt" id="c-open">0</span></div>
<div class="tab" onclick="setTab('urgent',this)">דחוף <span class="cnt" id="c-urgent">0</span></div>
<div class="tab" onclick="setTab('done',this)">סופק <span class="cnt" id="c-done">0</span></div>
<div class="tab" onclick="setTab('service',this)">שירות פתוח <span class="cnt" id="c-service">0</span></div>
<div class="tab" onclick="setTab('service-done',this)">שירות טופל <span class="cnt" id="c-service-done">0</span></div>
<div class="tab" onclick="setTab('expenses',this)">הוצאות <span class="cnt" id="c-expenses">0</span></div>
<div class="tab" onclick="setTab('employees',this)">עובדים <span class="cnt" id="c-employees">0</span></div>
</div>

<div class="cards" id="cards"></div>
<div class="updated" id="updated"></div>
</div>

<script>
let allData={orders:[],service:[],expenses:[],employees:[],employeeRecords:[]};
let currentTab='all';

function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;');}

// ── התחברות מנהל ─────────────────────────────────────────────────────────────
function authHeaders(){
return {'x-admin-password':localStorage.getItem('adminPassword')||''};
}

async function authedFetch(url,opts){
opts=opts||{};
opts.headers=Object.assign({},opts.headers||{},authHeaders());
const r=await fetch(url,opts);
if(r.status===401){
showLoginGate('הסיסמה שגויה, נסה שוב');
throw new Error('לא מורשה');
}
return r;
}

function showLoginGate(err){
document.getElementById('login-gate').style.display='flex';
document.getElementById('login-err').textContent=err||'';
}

async function doLogin(){
const pass=document.getElementById('login-pass').value;
const errEl=document.getElementById('login-err');
errEl.textContent='';
try{
const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});
const d=await r.json();
if(d.ok){
localStorage.setItem('adminPassword',pass);
document.getElementById('login-gate').style.display='none';
load();
}else{
errEl.textContent=d.error||'סיסמה שגויה';
}
}catch(e){errEl.textContent='שגיאת חיבור: '+e.message;}
}

async function uploadZohoInvoice(){
const invNum=document.getElementById('zoho-inv-num').value.trim();
const statusEl=document.getElementById('invoice-status');
const btn=document.querySelector('.upload-btn');
if(!invNum){
statusEl.className='invoice-status error';
statusEl.textContent='אנא הכנס מספר חשבונית';
return;
}
statusEl.className='invoice-status loading';
statusEl.textContent='מוריד חשבונית מ-Zoho ומעלה...';
btn.disabled=true;
try{
const r=await authedFetch('/api/upload-zoho-invoice',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({invoiceNumber:invNum})
});
const d=await r.json();
if(d.success){
statusEl.className='invoice-status success';
statusEl.textContent='✅ חשבונית '+invNum+' הועלתה בהצלחה ל-Drive ונרשמה ב-Excel';
document.getElementById('zoho-inv-num').value='';
}else{
statusEl.className='invoice-status error';
statusEl.textContent='שגיאה: '+(d.error||'לא ידוע');
}
}catch(e){
statusEl.className='invoice-status error';
statusEl.textContent='שגיאת חיבור: '+e.message;
}finally{btn.disabled=false;}
}

function setTab(tab,el){
currentTab=tab;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
render();
}

function isChecked(val){
if(val===true)return true;
const s=String(val||'').trim().toUpperCase();
return s==='TRUE'||s==='V'||s==='YES'||s==='1'||s==='כן';
}

function isUrgent(row){
return String(row.orderNum||'').includes('דחוף')||String(row.orderNum||'').toUpperCase().includes('URGENT');
}

function getStatus(row){
if(isChecked(row.supplied))return 'done';
if(isUrgent(row))return 'urgent';
return 'open';
}

function badgeHtml(status){
const map={
open:['b-open','פתוח'],
done:['b-done','סופק'],
urgent:['b-urgent','דחוף'],
service:['b-service','שירות פתוח'],
'service-done':['b-sdone','שירות טופל']
};
const[cls,label]=map[status]||['b-open',status];
return `<span class="badge ${cls}">${label}</span>`;
}

function fmtDate(v){
if(!v||v==='29/01/1900'||v==='17/01/1900')return '—';
return v;
}

function fmtMoney(v){
if(!v)return '—';
const n=parseFloat(String(v).replace(/[^0-9.]/g,''));
return isNaN(n)?v:'₪'+Math.round(n).toLocaleString();
}

function linkBtn(url,icon,label){
if(!url||!url.trim())return `<span class="link-btn no-link">${icon} ${label}</span>`;
return `<a href="${url}" target="_blank" class="link-btn">${icon} ${label}</a>`;
}

function renderOrderCard(r){
const status=getStatus(r);
const urgent=status==='urgent';
return `<div class="card${urgent?' urgent':''}">
<div class="card-header">
<span class="card-num">#${r.orderNum||'—'}</span>
${badgeHtml(status)}
</div>
<div class="card-grid">
<div><div class="field-label">עיר</div><div class="field-val">${r.city||'—'}</div></div>
<div><div class="field-label">עלות</div><div class="field-val">${fmtMoney(r.cost)}</div></div>
<div><div class="field-label">תאריך הזמנה</div><div class="field-val">${fmtDate(r.orderDate)}</div></div>
<div><div class="field-label">מועד אספקה</div><div class="field-val">${fmtDate(r.deliveryDate)}</div></div>
</div>
${r.notes?`<div class="notes-badge">📝 ${r.notes}</div><br>`:''}
<div class="card-footer">
${linkBtn(r.invoiceLink,'📄','הזמנת רכש')}${linkBtn(r.zohoInvoiceLink,'🧾','חשבונית')}
${linkBtn(r.confirmationLink,'✍️','אישור קבלה')}
</div>
</div>`;
}

function renderServiceCard(r){
const fixed=isChecked(r.fixed);
return `<div class="card">
<div class="card-header">
<span class="card-num">#${r.orderNum||'—'}</span>
${badgeHtml(fixed?'service-done':'service')}
</div>
<div class="card-grid">
<div><div class="field-label">תאריך בקשה</div><div class="field-val">${fmtDate(r.requestDate)}</div></div>
<div><div class="field-label">תאריך טיפול</div><div class="field-val">${fmtDate(r.fixDate)}</div></div>
</div>
${r.notes?`<div class="notes-badge">📝 ${r.notes}</div>`:''}
</div>`;
}

function renderExpenseCard(r){
return `<div class="card">
<div class="card-header">
<span class="card-num">${fmtDate(r.date)}</span>
</div>
<div class="card-grid">
<div><div class="field-label">סכום</div><div class="field-val">${fmtMoney(r.amount)}</div></div>
</div>
<div class="card-footer">
${linkBtn(r.receiptLink,'🧾','קבלה')}
</div>
</div>`;
}

function employeeRecordRow(name,r){
const month=r.month||'';
return `<div class="emp-row" data-emp="${esc(name)}">
<div class="f-group"><label>חודש</label><input type="text" class="f-month" value="${esc(month)}" placeholder="יולי 2026"></div>
<div class="f-group"><label>שעות</label><input type="text" class="f-hours" value="${esc(r.hours)}"></div>
<div class="f-group"><label>עמלות ממכירה</label><input type="text" class="f-commission" value="${esc(r.commission)}"></div>
<div class="f-group"><label>שולם</label><input type="text" class="f-paid" value="${esc(r.paid)}"></div>
<div class="f-group"><label>תאריך תשלום</label><input type="text" class="f-paidDate" value="${esc(r.paidDate)}"></div>
<div class="f-group" style="min-width:160px"><label>הערות</label><input type="text" class="f-notes" value="${esc(r.notes)}"></div>
<div class="f-group"><label>קבלה</label>${linkBtn(r.receiptLink,'🧾','קבלה')}</div>
<button class="save-btn" onclick="saveEmployeeRecord(this)">💾 שמור</button>
</div>`;
}

function renderEmployeesTab(){
const container=document.getElementById('cards');
const q=document.getElementById('search').value.trim().toLowerCase();
let html=`<div class="emp-panel">
<h3>➕ הוספת עובד חדש</h3>
<div class="row">
<input type="text" id="new-emp-name" placeholder="שם מלא">
<input type="text" id="new-emp-pass" placeholder="סיסמה">
<input type="text" id="new-emp-phone" placeholder="טלפון">
<input type="text" id="new-emp-notes" placeholder="הערות">
</div>
<label class="emp-admin-toggle"><input type="checkbox" id="new-emp-admin"> הרשאת מנהל (יוכל לראות ולערוך את כל העובדים)</label>
<button class="emp-add-btn" onclick="addEmployee()">הוסף עובד</button>
<div class="upload-status" id="emp-add-status"></div>
</div>`;
let employees=allData.employees||[];
if(q){employees=employees.filter(e=>String(e.name||'').toLowerCase().includes(q));}
if(employees.length===0){
html+='<div class="empty">אין עדיין עובדים רשומים</div>';
}else{
employees.forEach(emp=>{
const records=(allData.employeeRecords||[]).filter(r=>r.name===emp.name).sort((a,b)=>(b.month||'').localeCompare(a.month||''));
html+=`<div class="emp-card">
<div class="emp-card-header">
<h4>${esc(emp.name)}${emp.isAdmin?' <span style="font-size:11px;color:#7c3aed;font-weight:600">(מנהל)</span>':''}</h4>
<label class="emp-admin-toggle" style="margin-bottom:0"><input type="checkbox" class="emp-admin-check" data-name="${esc(emp.name)}" ${emp.isAdmin?'checked':''} onchange="toggleEmployeeAdmin(this)"> הרשאת מנהל</label>
<span class="emp-meta">${esc(emp.phone||'')}${emp.notes?' · '+esc(emp.notes):''}</span>
</div>
${records.map(r=>employeeRecordRow(emp.name,r)).join('')}
${employeeRecordRow(emp.name,{month:'',hours:'',commission:'',paid:'',paidDate:'',notes:'',receiptLink:''})}
</div>`;
});
}
container.innerHTML=html;
}

async function saveEmployeeRecord(btn){
const row=btn.closest('.emp-row');
const name=row.dataset.emp;
const month=row.querySelector('.f-month').value.trim();
if(!month){alert('נא למלא חודש');return;}
const payload={
name,month,
hours:row.querySelector('.f-hours').value.trim(),
commission:row.querySelector('.f-commission').value.trim(),
paid:row.querySelector('.f-paid').value.trim(),
paidDate:row.querySelector('.f-paidDate').value.trim(),
notes:row.querySelector('.f-notes').value.trim()
};
const origLabel=btn.textContent;
btn.disabled=true;
btn.textContent='שומר...';
try{
const r=await authedFetch('/api/admin/employee-records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
const d=await r.json();
if(d.success){
btn.textContent='✅ נשמר';
await load();
}else{
btn.textContent=origLabel;
alert('שגיאה: '+(d.error||'לא ידוע'));
}
}catch(e){
btn.textContent=origLabel;
alert('שגיאת חיבור: '+e.message);
}finally{btn.disabled=false;}
}

async function addEmployee(){
const name=document.getElementById('new-emp-name').value.trim();
const pass=document.getElementById('new-emp-pass').value.trim();
const phone=document.getElementById('new-emp-phone').value.trim();
const notes=document.getElementById('new-emp-notes').value.trim();
const isAdmin=document.getElementById('new-emp-admin').checked;
const statusEl=document.getElementById('emp-add-status');
if(!name||!pass){
statusEl.className='upload-status error';
statusEl.textContent='נא למלא שם וסיסמה';
return;
}
statusEl.className='upload-status loading';
statusEl.textContent='מוסיף עובד...';
try{
const r=await authedFetch('/api/admin/employees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,password:pass,phone,notes,isAdmin})});
const d=await r.json();
if(d.success){
statusEl.className='upload-status success';
statusEl.textContent='✅ העובד נוסף בהצלחה';
document.getElementById('new-emp-name').value='';
document.getElementById('new-emp-pass').value='';
document.getElementById('new-emp-phone').value='';
document.getElementById('new-emp-notes').value='';
document.getElementById('new-emp-admin').checked=false;
await load();
}else{
statusEl.className='upload-status error';
statusEl.textContent='שגיאה: '+(d.error||'לא ידוע');
}
}catch(e){
statusEl.className='upload-status error';
statusEl.textContent='שגיאת חיבור: '+e.message;
}
}

async function toggleEmployeeAdmin(checkbox){
const name=checkbox.dataset.name;
const emp=(allData.employees||[]).find(e=>e.name===name);
if(!emp){checkbox.checked=!checkbox.checked;return;}
const wanted=checkbox.checked;
checkbox.disabled=true;
try{
const r=await authedFetch('/api/admin/employees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:emp.name,password:emp.password,phone:emp.phone,notes:emp.notes,isAdmin:wanted})});
const d=await r.json();
if(d.success){
await load();
}else{
checkbox.checked=!wanted;
alert('שגיאה: '+(d.error||'לא ידוע'));
}
}catch(e){
checkbox.checked=!wanted;
alert('שגיאת חיבור: '+e.message);
}finally{checkbox.disabled=false;}
}

function render(){
const q=document.getElementById('search').value.trim().toLowerCase();
if(currentTab==='employees'){
renderEmployeesTab();
updateCounts();
return;
}
const isSvc=currentTab==='service'||currentTab==='service-done';
const isExp=currentTab==='expenses';
let rows=[];
if(isExp){
rows=allData.expenses.filter(r=>{
if(q){const h=[r.supplier,r.description,r.notes].join(' ').toLowerCase();if(!h.includes(q))return false;}
return true;
});
}else if(isSvc){
rows=allData.service.filter(r=>{
const fixed=isChecked(r.fixed);
if(currentTab==='service'&&fixed)return false;
if(currentTab==='service-done'&&!fixed)return false;
if(q){const h=[r.orderNum,r.notes].join(' ').toLowerCase();if(!h.includes(q))return false;}
return true;
});
}else{
rows=allData.orders.filter(r=>{
const s=getStatus(r);
if(currentTab==='open'&&s!=='open')return false;
if(currentTab==='urgent'&&s!=='urgent')return false;
if(currentTab==='done'&&s!=='done')return false;
if(q){const h=[r.orderNum,r.city,r.notes].join(' ').toLowerCase();if(!h.includes(q))return false;}
return true;
});
}
const container=document.getElementById('cards');
if(rows.length===0){
container.innerHTML='<div class="empty">אין רשומות</div>';
}else{
container.innerHTML=rows.map(r=>isExp?renderExpenseCard(r):(isSvc?renderServiceCard(r):renderOrderCard(r))).join('');
}
updateCounts();
}

function updateCounts(){
const o=allData.orders,s=allData.service,ex=allData.expenses||[];
const q=document.getElementById('search').value.trim().toLowerCase();
const fo=fn=>o.filter(r=>{
if(q){const h=[r.orderNum,r.city,r.notes].join(' ').toLowerCase();if(!h.includes(q))return false;}
return fn(r);
});
document.getElementById('c-all').textContent=o.length+s.length;
document.getElementById('c-open').textContent=fo(r=>getStatus(r)==='open').length;
document.getElementById('c-urgent').textContent=fo(r=>getStatus(r)==='urgent').length;
document.getElementById('c-done').textContent=fo(r=>getStatus(r)==='done').length;
document.getElementById('c-service').textContent=s.filter(r=>!isChecked(r.fixed)).length;
document.getElementById('c-service-done').textContent=s.filter(r=>isChecked(r.fixed)).length;
document.getElementById('c-expenses').textContent=ex.length;
document.getElementById('c-employees').textContent=(allData.employees||[]).length;
const open=o.filter(r=>getStatus(r)==='open'||getStatus(r)==='urgent');
document.getElementById('s-open').textContent=open.length;
document.getElementById('s-urgent').textContent=o.filter(r=>getStatus(r)==='urgent').length;
document.getElementById('s-service').textContent=s.filter(r=>!isChecked(r.fixed)).length;
const total=open.reduce((sum,r)=>sum+(parseFloat(String(r.cost||'').replace(/[^0-9.]/g,''))||0),0);
document.getElementById('s-sum').textContent='₪'+Math.round(total).toLocaleString();
const now=new Date();
const thisMonthTotal=ex.filter(r=>{
const d=new Date(r.date.split('/').reverse().join('-'));
return !isNaN(d)&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
}).reduce((sum,r)=>sum+(parseFloat(String(r.amount||'').replace(/[^0-9.]/g,''))||0),0);
document.getElementById('s-expenses').textContent='₪'+Math.round(thisMonthTotal).toLocaleString();
}

async function load(){
document.getElementById('updated').textContent='טוען...';
try{
const [r,rExp,rEmp,rEmpRec]=await Promise.all([
authedFetch('/api/crm-data'),
authedFetch('/api/expenses-data'),
authedFetch('/api/admin/employees'),
authedFetch('/api/admin/employee-records')
]);
if(!r.ok)throw new Error('שגיאת שרת '+r.status);
const d=await r.json();
if(d.error)throw new Error(d.error);
const dExp=rExp.ok?await rExp.json():{expenses:[]};
const dEmp=rEmp.ok?await rEmp.json():{employees:[]};
const dEmpRec=rEmpRec.ok?await rEmpRec.json():{records:[]};
allData={orders:d.orders,service:d.service,expenses:dExp.expenses||[],employees:dEmp.employees||[],employeeRecords:dEmpRec.records||[]};
render();
document.getElementById('updated').textContent='עודכן: '+new Date().toLocaleString('he-IL');
}catch(e){
document.getElementById('updated').textContent='שגיאה: '+e.message;
}
}

if(localStorage.getItem('adminPassword')){
document.getElementById('login-gate').style.display='none';
load();
}else{
showLoginGate('');
}
</script>
